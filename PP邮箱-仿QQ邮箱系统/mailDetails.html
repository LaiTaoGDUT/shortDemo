<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta charset="utf-8" />
    <title>Tables - Ace Admin</title>

    <meta name="description" content="Static &amp; Dynamic Tables" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />

    <!-- bootstrap & fontawesome -->
    <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/font-awesome/4.5.0/css/font-awesome.min.css" />

    <!-- page specific plugin styles -->

    <!-- text fonts -->
    <link rel="stylesheet" href="assets/css/fonts.googleapis.com.css" />

    <!-- ace styles -->
    <link rel="stylesheet" href="assets/css/ace.min.css" class="ace-main-stylesheet" id="main-ace-style" />

    <!--[if lte IE 9]>
			<link rel="stylesheet" href="assets/css/ace-part2.min.css" class="ace-main-stylesheet" />
		<![endif]-->
    <link rel="stylesheet" href="assets/css/ace-skins.min.css" />
    <link rel="stylesheet" href="assets/css/ace-rtl.min.css" />
    <link rel="stylesheet" href="assets/css/my-craft.css" />
    <!--[if lte IE 9]>
		  <link rel="stylesheet" href="assets/css/ace-ie.min.css" />
		<![endif]-->

    <!-- inline styles related to this page -->

    <!-- ace settings handler -->
    <script src="assets/js/ace-extra.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
    <!-- HTML5shiv and Respond.js for IE8 to support HTML5 elements and media queries -->
    <script>
        window.onbeforeunload = function (e) {
            localStorage.setItem('mailData', JSON.stringify(mailData));
        };	
    </script>
    <!--[if lte IE 8]>
		<script src="assets/js/html5shiv.min.js"></script>
		<script src="assets/js/respond.min.js"></script>
		<![endif]-->
    <style>
        .black {
            color: black;
        }

        .green {
            color: green;
        }

        .red {
            color: red;
        }

        .my-icon {
            float: right;
            cursor: pointer;
        }

        .btn-blue {
            color: #307ecc !important;
            height: 34px !important;
            margin-left: 2px;
        }

        .my-search {
            width: 410px;
            margin: 0 0 0 auto;
        }
    </style>
</head>

<body class="no-skin">
    <div class="main-container ace-save-state" id="main-container">
        <script type="text/javascript">
            try { ace.settings.loadState('main-container') } catch (e) { }
        </script>
        <div class="main-content">
            <div class="main-content-inner">
                <div class="page-content">
                    <div class="row">
                        <div class="col-xs-12">
                            <div class="row">
                                <div class="col-xs-12" id="my-table">
                                    <!-- 标题 -->
                                    <div class="text-title">
                                        <span ref="page" title="details">邮件详情</span>
                                    </div>
                                    <!-- 按钮 -->
                                    <div class="toolbg toolbgline toolheight nowrap">
                                        <div class="nowrap left">
                                            <a class="btn_gray btn_space" @click="returnPrePage()">返回</a>
                                            <input type="button" class="btn_sepline">
                                            <a v-show="curBox != 'deleted'"class="btn_gray btn_space" @click="deleteMail()">删除</a>
                                            <a class="btn_gray btn_space" @click="deleteMailEntirely()">彻底删除</a>
                                            <div class="btn-group">
                                                <button data-toggle="dropdown"
                                                    class="btn_gray btn_space dropdown-toggle" aria-expanded="false">
                                                    标记为...
                                                    <i class="ace-icon fa fa-angle-down icon-on-right"></i>
                                                </button>
                                                <ul class="dropdown-menu">
                                                    <li>
                                                        <a @click="readMail()">已读邮件</a>
                                                    </li>

                                                    <li>
                                                        <a @click="unreadMail()">未读邮件</a>
                                                    </li>
                                                    <li class="divider"></li>
                                                    <li>
                                                        <a @click="starMail(true)">星标邮件</a>
                                                    </li>
                                                    <li>
                                                        <a @click="starMail(false)">取消星标</a>
                                                    </li>
                                                </ul>
                                            </div>
                                            <div class="btn-group">
                                                <button data-toggle="dropdown"
                                                    class="btn_gray btn_space dropdown-toggle" aria-expanded="false">
                                                    移动到...
                                                    <i class="ace-icon fa fa-angle-down icon-on-right"></i>
                                                </button>
                                                <ul class="dropdown-menu">
                                                    <li>
                                                        <a v-show="curBox != 'inbox'" @click="moveToInbox()">收件箱</a>
                                                    </li>
                                                    <li>
                                                        <a v-show="curBox != 'sended'" @click="moveToSended()">已发送</a>
                                                    </li>
                                                </ul>
                                            </div>
                                        </div>
                                    </div>
                                    <div style="position:relative;z-index:2;zoom:1;" class="readmailinfo">
                                        <table style="height:24px" cellspacing="0" cellpadding="0" border="0">
                                            <tr>
                                                <td style="word-break:break-all;padding:9px 8px 2px 14px !important;"
                                                    class="txt_left settingtable readmail_subject" valign="middle"
                                                    height="24">
                                                    <div class="qm_left" style="padding-bottom:3px;"><span id="subject"
                                                            class="sub_title ">{{ mail.title }}</span><input
                                                            type="button" id="img_star" ck="starMail"
                                                            class="qm_ico_flagoff" title="标为星标" hidefocus="" :class="{my_star : mail.star}"  @click="starMail()"></div>
                                                    <div id="tagContainer" ck="tag" class="TagDiv TagReadmail"
                                                        style="overflow:visible;margin-top:0;"></div>
                                                    <div class="clr"></div>
                                                </td>
                                            </tr>
                                        </table>
                                        <table cellspacing="0" cellpadding="0" border="0">
                                            <tr>
                                                <td style="padding-left:14px !important" class="settingtable txt_left">
                                                    <span class="addrtitle">发件人：</span>
                                                    <span><b class="grn">{{ mail.Sender }}</b>&nbsp;<b class="tcolor"><{{ mail.SenderAdd }}></b>&nbsp;&nbsp;</span>
                                                </td>
                                            </tr>
                                        </table>
                                        <table cellspacing="0" cellpadding="0" border="0">
                                            <tr>
                                                <td style="padding-left:14px !important" class="settingtable txt_left">
                                                    <span class="addrtitle">时&nbsp;&nbsp;&nbsp;间：</span>
                                                    <span><b class="tcolor">{{ mail.time | dateFormat }}</b></span>
                                                </td>
                                            </tr>
                                        </table>
                                        <table cellspacing="0" cellpadding="0" border="0">
                                            <tr>
                                                <td style="padding-left:14px !important" class="settingtable txt_left">
                                                    <span class="addrtitle">收件人：</span>
                                                    <span style="color: #000">{{ mail.receiver }}&nbsp;<b class="tcolor"><{{ mail.receiverAdd }}></b></span>
                                                </td>
                                            </tr>
                                        </table>
                                    </div>
                                    <div id="mailContentContainer" style="position:relative;font-size:14px;height:auto;padding:15px 15px 10px 15px;z-index:1;zoom:1;line-height:1.7;">
                                        <div v-html="mail.content"></div>
                                    </div>
                                </div>
                            </div>
                            <!-- PAGE CONTENT ENDS -->
                        </div><!-- /.col -->
                    </div><!-- /.row -->
                </div><!-- /.page-content -->
            </div>
        </div><!-- /.main-content -->
        <a href="#" id="btn-scroll-up" class="btn-scroll-up btn btn-sm btn-inverse">
            <i class="ace-icon fa fa-angle-double-up icon-only bigger-110"></i>
        </a>
    </div><!-- /.main-container -->

    <!-- basic scripts -->

    <!--[if !IE]> -->
    <script src="assets/js/jquery-2.1.4.min.js"></script>

    <!-- <![endif]-->

    <!--[if IE]>
<script src="assets/js/jquery-1.11.3.min.js"></script>
<![endif]-->
    <script type="text/javascript">
        if ('ontouchstart' in document.documentElement) document.write("<script src='assets/js/jquery.mobile.custom.min.js'>" + "<" + "/script>");		
    </script>
    <script src="assets/js/bootstrap.min.js"></script>

    <!-- page specific plugin scripts -->
    <script src="assets/js/jquery.dataTables.min.js"></script>
    <script src="assets/js/jquery.dataTables.bootstrap.min.js"></script>
    <script src="assets/js/dataTables.buttons.min.js"></script>
    <script src="assets/js/buttons.flash.min.js"></script>
    <script src="assets/js/buttons.html5.min.js"></script>
    <script src="assets/js/buttons.print.min.js"></script>
    <script src="assets/js/buttons.colVis.min.js"></script>
    <script src="assets/js/dataTables.select.min.js"></script>

    <!-- ace scripts -->
    <script src="assets/js/ace-elements.min.js"></script>
    <script src="assets/js/ace.min.js"></script>
    <script src="assets/js/my-mailDetails.js"></script>

    <!-- inline scripts related to this page -->
</body>

</html>

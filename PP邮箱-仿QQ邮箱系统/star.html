		window.onbeforeunload = function (e) {
			localStorage.setItem('mailData', JSON.stringify(mailData));

	<style>
		.black {
			color: black;
		}

		.green {
			color: green;
		}

		.red {
			color: red;
		}

		.my-icon {
			float: right;
			cursor: pointer;
		}

		.btn-blue {
			color: #307ecc !important;

<body class="no-skin">
	<div class="main-container ace-save-state" id="main-container">
		<script type="text/javascript">
			try { ace.settings.loadState('main-container') } catch (e) { }
		</script>
		<div class="main-content">
			<div class="main-content-inner">
				<div class="page-content">
					<div class="row">
						<div class="col-xs-12">
							<div class="row">
								<div class="col-xs-12" id="my-table">
									<!-- 标题 -->
									<div class="text-title">
										<span ref="page" title="star">星标邮件</span>
										<span class="f_size normal black">
											(共
											<span>{{ star.length }}</span>
											封)
										</span>
									</div>
									<!-- 按钮 -->
									<div class="toolbg toolbgline toolheight nowrap">
										<div class="nowrap left">
											<a class="btn_gray btn_space" @click="deleteMail()">删除</a>
											<a class="btn_gray btn_space" @click="deleteMailEntirely()">彻底删除</a>
											<a class="btn_gray btn_space" @click="readAllMail()">全部标为已读</a>
											<div class="btn-group">
												<button data-toggle="dropdown"
													class="btn_gray btn_space dropdown-toggle" aria-expanded="false">
													标记为...
													<i class="ace-icon fa fa-angle-down icon-on-right"></i>
												</button>
												<ul class="dropdown-menu">
													<li>
														<a @click="readMail()">已读邮件</a>
													</li>

													<li>
														<a @click="unreadMail()">未读邮件</a>
													</li>
													<li class="divider"></li>
													<li>
														<a @click="starMail(true)">星标邮件</a>
													</li>
													<li>
														<a @click="starMail(false)">取消星标</a>
													</li>
												</ul>
											</div>
											<div class="btn-group">
												<button data-toggle="dropdown"
													class="btn_gray btn_space dropdown-toggle" aria-expanded="false">
													移动到...
													<i class="ace-icon fa fa-angle-down icon-on-right"></i>
												</button>
												<ul class="dropdown-menu">
													<!-- <li>
														<a @click="moveToInbox()">收件箱</a>
													</li> -->
													<li>
														<a @click="moveToSended()">已发送</a>
													</li>
												</ul>
											</div>
										</div>
									</div>
									<div>
										<table id="dynamic-table"
											class="table table-striped table-bordered table-hover i">
											<thead>
												<tr>
													<th style="text-align:center;width: 35px;" id="grid-table_cb"
														role="columnheader"
														class="ui-th-column ui-th-ltr ui-state-default"
														style="width: 35px;">
														<div id="jqgh_grid-table_cb"><input role="checkbox"
																id="cb_grid-table" class="cbox" type="checkbox" :checked="allMailSelected" @click="checkAllMail()"><span
																class="s-ico" style="display:none"><span sort="asc"
																	class="ui-grid-ico-sort ui-icon-asc ui-sort-ltr ui-state-disabled ui-icon ui-icon-triangle-1-n"></span><span
																	sort="desc"
																	class="ui-grid-ico-sort ui-icon-desc ui-sort-ltr ui-state-disabled ui-icon ui-icon-triangle-1-s"></span></span>
														</div>
													</th>
													<th style="width:37px;padding:0;">
														<div class="ciz" style="float: left;"></div>
														<input type="button" class="ico_mailtitle" disabled="">
													</th>
													<th style="width:135px;"><div style="margin-left: 10px;">发件人</div></th>
													<th><div style="margin-left: 10px;">主题</div></th>
													<th style="padding-left:2px;width:100px;"><div style="margin-left: 10px;">时间</div></th>
													<th style="width:30px;font-size:1px;padding-left:2px"></th>
												</tr>
											</thead>
											<tbody>
												<tr v-for="mail in star" :key="mail.id">
													<td role="gridcell" style="text-align:center;width: 35px;"
														aria-describedby="grid-table_cb"><input role="checkbox"
															type="checkbox" id="jqg_grid-table_1" class="cbox cbox"
															name="jqg_grid-table_1" :checked="mail.selected" @click="checkMail(mail)"></td>
													<td class="ci">
														<div class="ciz "></div>
														<div class="cir" :class="{Rr: mail.readed, Ru : !mail.readed}" title="新窗口读信"></div>
														<!-- <div class="cir Ru" title="腾讯系统邮件"></div> -->
													</td>
													<td class="tl tf " @click="openMail(mail)">
														<span :class="{strong : !mail.readed}">{{ mail.Sender }}</span>	
													</td>
													<td class="gt" @click="openMail(mail)">
														<div class="tf no" >
															<u tabindex="0" class="black tt " :class="{strong : !mail.readed}">{{ mail.title }}</u>
															<b class="no ">-{{ mail.content | contentView }}</b>&nbsp;
														</div>
														<div class="TagDiv"> </div>
													</td>
													<td class="dt" @click="openMail(mail)">
														<div>{{ mail.time | dateFormat }}</div>
													</td>
													<td class="fg" :class="{fs1 : mail.star}" title="标记星标" @click="starMail(mail)">
														<div></div>
													</td>
												</tr>
											</tbody>
										</table>
									</div>
								</div>
							</div>
							<!-- PAGE CONTENT ENDS -->
						</div><!-- /.col -->
					</div><!-- /.row -->
				</div><!-- /.page-content -->
			</div>
		</div><!-- /.main-content -->

		<div class="footer">
			<div class="footer-inner">
				<div class="footer-content">
					<span class="bigger-120">
						<span class="blue bolder">Ace</span>
						Application &copy; 2013-2014
					</span>

					&nbsp; &nbsp;
					<span class="action-buttons">
						<a href="#">
							<i class="ace-icon fa fa-twitter-square light-blue bigger-150"></i>
						</a>

						<a href="#">
							<i class="ace-icon fa fa-facebook-square text-primary bigger-150"></i>
						</a>

						<a href="#">
							<i class="ace-icon fa fa-rss-square orange bigger-150"></i>
						</a>
					</span>
				</div>
			</div>
		</div>

		<a href="#" id="btn-scroll-up" class="btn-scroll-up btn btn-sm btn-inverse">
			<i class="ace-icon fa fa-angle-double-up icon-only bigger-110"></i>
		</a>
